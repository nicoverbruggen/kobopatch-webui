name: Build and test project

on:
  push:
    branches: [main, develop]
    tags: ['v*']

env:
  GOCACHE: ${{ github.workspace }}/tmp/go/cache

jobs:
  unit-and-lint:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  wasm-checks:
    name: WASM build and Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: tools/kobopatch-wasm/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Clone kobopatch source
        run: npm run setup:wasm

      - name: Run native tests
        run: |
          mkdir -p "$GOCACHE"
          cd tools/kobopatch-wasm/kobopatch-src
          go test ./...

      - name: Build WASM binary
        run: |
          npm run build:wasm
          test -f tools/kobopatch-wasm/kobopatch.wasm || { echo "ERROR: kobopatch.wasm not found after build"; exit 1; }

      - name: Run WASM tests
        run: |
          mkdir -p "$GOCACHE"
          cd tools/kobopatch-wasm/kobopatch-src
          GOROOT="$(go env GOROOT)"
          if [ -f "$GOROOT/lib/wasm/go_js_wasm_exec" ]; then
            EXEC="$GOROOT/lib/wasm/go_js_wasm_exec"
          else
            EXEC="$GOROOT/misc/wasm/go_js_wasm_exec"
          fi
          GOOS=js GOARCH=wasm go test -exec="$EXEC" ./...

  assets:
    name: Firmware and installable assets
    runs-on: ubuntu-latest
    outputs:
      cache-date: ${{ steps.cache-date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set cache date
        id: cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Resolve cache paths
        id: cache-paths
        run: |
          {
            echo 'paths<<EOF'
            echo 'tests/e2e/cached_assets'
            node tools/installables/installables.mjs --src --cache-paths
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Cache firmware and installable assets
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: firmware-installables-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ hashFiles('tests/e2e/config/firmware-config.js', 'tools/installables/installables.mjs', 'installables.lock') }}

      - name: Download test firmware
        run: |
          mkdir -p tests/e2e/cached_assets
          node -e "var c=require('./tests/e2e/config/firmware-config'); console.log(JSON.stringify([c.primary, c.secondary]))" | jq -c '.[]' | while IFS= read -r entry; do
            version=$(echo "$entry" | jq -r '.version')
            url=$(echo "$entry" | jq -r '.url')
            file="tests/e2e/cached_assets/kobo-update-${version}.zip"
            if [ ! -f "$file" ]; then
              echo "Downloading firmware $version..."
              curl -fL --progress-bar -o "$file" "$url"
            fi
          done

      - name: Set up installable assets
        run: npm run setup:installables

  wasm-integration:
    name: WASM integration
    runs-on: ubuntu-latest
    needs: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve cache paths
        id: cache-paths
        run: |
          {
            echo 'paths<<EOF'
            echo 'tests/e2e/cached_assets'
            node tools/installables/installables.mjs --src --cache-paths
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore firmware and installable assets
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: firmware-installables-${{ runner.os }}-${{ needs.assets.outputs.cache-date }}-${{ hashFiles('tests/e2e/config/firmware-config.js', 'tools/installables/installables.mjs', 'installables.lock') }}
          fail-on-cache-miss: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: tools/kobopatch-wasm/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install dependencies
        run: npm install

      - name: Clone kobopatch source
        run: npm run setup:wasm

      - name: Build WASM binary
        run: npm run build:wasm

      - name: Build web app
        run: npm run build

      - name: Full integration test
        run: npm run test:wasm

  patch-blacklist:
    name: Patch blacklist check
    runs-on: ubuntu-latest
    needs: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve cache paths
        id: cache-paths
        run: |
          {
            echo 'paths<<EOF'
            echo 'tests/e2e/cached_assets'
            node tools/installables/installables.mjs --src --cache-paths
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore firmware and installable assets
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: firmware-installables-${{ runner.os }}-${{ needs.assets.outputs.cache-date }}-${{ hashFiles('tests/e2e/config/firmware-config.js', 'tools/installables/installables.mjs', 'installables.lock') }}
          fail-on-cache-miss: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: tools/kobopatch-wasm/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Clone kobopatch source
        run: npm run setup:wasm

      - name: Check patch blacklist
        run: npm run test:patches:check

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve cache paths
        id: cache-paths
        run: |
          {
            echo 'paths<<EOF'
            echo 'tests/e2e/cached_assets'
            node tools/installables/installables.mjs --src --cache-paths
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore firmware and installable assets
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: firmware-installables-${{ runner.os }}-${{ needs.assets.outputs.cache-date }}-${{ hashFiles('tests/e2e/config/firmware-config.js', 'tools/installables/installables.mjs', 'installables.lock') }}
          fail-on-cache-miss: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: tools/kobopatch-wasm/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fresh E2E integration test
        run: npm run test:e2e:fresh

  download-url-check:
    name: Firmware download URL check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate download URLs
        run: |
          cd tests/e2e/scripts
          ./validate-dl-urls.sh
