        <section id="step-patches" class="step" hidden>
            <div id="patch-reload-banner" class="banner banner--info patch-reload-banner" hidden>
                <span id="patch-reload-text">You connected a device that is or was previously patched. If you need to re-apply the previous patches, you can restore them, including any manual edits.</span>
                <button id="btn-patch-reload" class="secondary" type="button">Restore previous patches</button>
            </div>
            <p>Enable or disable patches below. Patches in the same group are mutually exclusive.</p>
            <div id="patch-container" class="patch-container-scroll"></div>
            <div class="step-actions">
                <button id="btn-patches-back" class="secondary">&#x2039; Back</button>
                <button id="btn-patches-next" class="primary" disabled>Continue &#x203A;</button>
            </div>
            <p id="patch-count-hint" class="fallback-hint"></p>
        </section>
